# Producción (VPS): docker compose -f docker-compose.prod.yml up -d --build
# Requiere un .env al lado de este archivo (ver .env.example)
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD}
      MYSQL_DATABASE: tan_bonito
      MYSQL_USER: tanbonito
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_USER: tanbonito
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: tan_bonito
      SESSION_SECRET: ${SESSION_SECRET:?Falta SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ADMIN_USER: ${ADMIN_USER:-jennifer}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "127.0.0.1:8080:8080"   # solo accesible por el proxy HTTPS (Caddy/nginx)
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
