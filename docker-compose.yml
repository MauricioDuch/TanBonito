# Desarrollo: docker compose up
#   App (Vite, recarga en vivo)  http://localhost:5173
#   API                          http://localhost:8080/api/health
#   MySQL (desde Workbench)      localhost:3307  usuario tanbonito / tanbonito
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tan_bonito
      MYSQL_USER: tanbonito
      MYSQL_PASSWORD: tanbonito
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "3307:3306"   # 3307 para no chocar con el MySQL local
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  server:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      DB_HOST: db
      DB_USER: tanbonito
      DB_PASSWORD: tanbonito
      DB_NAME: tan_bonito
      SESSION_SECRET: dev-secret
      ADMIN_USER: jennifer
      ADMIN_PASSWORD: tanbonito
      CHOKIDAR_USEPOLLING: "true"
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
      - server-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  client:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      API_URL: http://server:8080
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client-modules:/app/node_modules
    depends_on:
      - server

volumes:
  db-data:
  server-modules:
  client-modules:
